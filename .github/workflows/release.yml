name: Release Multiplataforma (Windows, macOS, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: considere-as-consequencias-linux-x86_64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: considere-as-consequencias-windows-x86_64
            ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: considere-as-consequencias-macos-aarch64
            ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: considere-as-consequencias-macos-x86_64
            ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/considere-as-consequencias dist/${{ matrix.asset_name }}/
          cp README.md LICENSE dist/${{ matrix.asset_name }}/
          tar -czf ${{ matrix.asset_name }}.tar.gz -C dist ${{ matrix.asset_name }}

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.asset_name }}
          Copy-Item target/${{ matrix.target }}/release/considere-as-consequencias.exe dist/${{ matrix.asset_name }}/
          Copy-Item README.md, LICENSE dist/${{ matrix.asset_name }}/
          Compress-Archive -Path dist/${{ matrix.asset_name }} -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.ext }}

  publish:
    name: Publicar GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
